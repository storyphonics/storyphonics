<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JKL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: #000; }
    body { min-height: 100vh; font-family: "Fredoka", sans-serif; font-weight: 700; }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 24px 18px 56px;
      text-align: center;
    }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(36px, 10vw, 64px);
      line-height: 1.15;
      font-weight: 700;
    }
    .cover {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 24px;
      border-radius: 16px;
    }
    audio {
      display: block;
      width: 100%;
      margin: 0 auto 30px;
    }
    .lyrics {
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1.8;
      font-weight: 700;
      color: #000;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>JKL</h1>
    <img class="cover" src="cover.png" alt="JKL cover">
    <audio controls preload="metadata">
      <source src="jklchant.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <div class="lyrics">neh
Hello! Hello!

Let’s learn today!

J for jam,

jam, jam, jam!

J for kite,

kite, kite, kite!

L for lion,

lion, lion, lion!

One, two, three!

J, K, L!

J, kite, L!
Wow!</div>
  </main>
</body>
</html>
