<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What&#x27;s Your Name?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: #000000;
      font-family: "Fredoka", sans-serif;
    }

    body {
      padding: 24px 16px 48px;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(36px, 10vw, 64px);
      line-height: 1.15;
      font-weight: 700;
      color: #000000;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 24px;
      border-radius: 18px;
    }

    audio {
      display: block;
      width: 100%;
      margin: 0 0 28px;
    }

    .lyrics {
      margin: 0;
      padding: 4px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: clamp(22px, 6vw, 32px);
      line-height: 1.8;
      font-weight: 700;
      text-align: center;
      color: #000000;
    }

    @media (min-width: 768px) {
      body {
        padding-top: 40px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>What&#x27;s Your Name?</h1>
    <img class="cover" src="cover.png" alt="What&#x27;s Your Name? cover">
    <audio controls preload="metadata">
      <source src="whatsyournamechant.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <div class="lyrics">What's your name?
Hey! Hello!

My name is Jenny.
Hi there, Jenny!

What's your name?
Hey, hey!

My name is Jenny.
Hi there!

What's your name?
Hey! Hello!

My name is Jenny.
Hi there! Hi!</div>
  </main>
</body>
</html>
