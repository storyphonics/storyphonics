<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A to Z - Alphabet Phonics Song</title>
  <style>
    body{font-family:Arial,sans-serif;text-align:center;margin:0;padding:30px 18px;background:#fff8dc;color:#17365d}
    .box{max-width:650px;margin:auto;background:white;border-radius:24px;padding:28px;box-shadow:0 4px 18px #0002}
    h1{margin:0 0 8px;font-size:2rem}
    h2{margin:0 0 24px;font-size:1.1rem;font-weight:normal}
    audio{width:100%;margin:12px 0 24px}
    img{width:180px;max-width:60%;height:auto}
    p{font-weight:bold}
  </style>
</head>
<body>
  <div class="box">
    <h1>Alphabet Phonics Song</h1>
    <h2>A to Z - Let's Sing Together!</h2>

    <audio controls preload="metadata">
      <source src="A%20to%20Z!.mp3" type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>

    <p>Scan &amp; Sing!</p>
    <img src="atozqr.png" alt="A to Z QR Code">
  </div>
</body>
</html>
